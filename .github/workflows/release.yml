name: Release

on:
  push:
    tags:
      - 'v*'

jobs:

  build:

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          # Uncomment to enable other platforms:
          # - os: ubuntu-latest
          # - os: macos-latest

    if: |
      contains(github.ref, 'refs/tags/v') &&
      !contains(github.ref, '-') &&
      !contains(github.ref, '+')

    runs-on: ${{ matrix.os }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Get environment info
        shell: bash
        run: |
          echo "GOOS=$(go env GOOS)"   >> $GITHUB_ENV
          echo "GOARCH=$(go env GOARCH)" >> $GITHUB_ENV
          echo "APP_NAME=prokishi-server" >> $GITHUB_ENV
          echo "VERSION=$(cat _cmd/prokishi-server/version | xargs)" >> $GITHUB_ENV

      - name: Display versions
        shell: bash
        run: |
          go version
          go env GOOS GOARCH
          node -v
          npm -v

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Wails doctor
        shell: bash
        run: |
          wails3 version
          wails3 doctor

      - name: Build
        working-directory: ./_cmd/prokishi-server
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            wails3 package
          else
            wails3 build
          fi

      - name: Archive build results
        shell: bash
        run: |
          ZIP_NAME="${APP_NAME}-${VERSION}_${GOOS}_${GOARCH}.zip"
          mkdir -p _archive
          cp -r ./_cmd/prokishi-server/bin/* _archive/
          cd _archive
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../${ZIP_NAME} ./*
          else
            zip -r ../${ZIP_NAME} ./*
          fi
          echo "ZIP_PATH=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.os }}-asset
          path: ${{ env.ZIP_PATH }}

  release:

    needs: build

    if: |
      success() &&
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref, '-') &&
      !contains(github.ref, '+')

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./all-zips
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          files: ./all-zips/*.zip
          generate_release_notes: true
          draft: true
          prerelease: false
